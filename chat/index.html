  a:hover { color: #fff0e2; }
  @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(360px); } }
  @keyframes twk { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes flick { 0%, 100% { opacity: 1; } 42% { opacity: 0.86; } 71% { opacity: 0.95; } }
  @keyframes rise { from { transform: translateY(10px); } to { transform: translateY(0); } }
  @keyframes dots { 0%, 20% { opacity: 0.25; } 50% { opacity: 1; } 80%, 100% { opacity: 0.25; } }
  #fit { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 7px; background: #2a2340; border: 2px solid #5a4a7a; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 16px; margin-top: -5px; background: #ffb38a; border: 2px solid #2a2340; cursor: pointer; }
  input[type=range]::-moz-range-track { height: 7px; background: #2a2340; border: 2px solid #5a4a7a; }
  input[type=range]::-moz-range-thumb { width: 11px; height: 16px; border-radius: 0; background: #ffb38a; border: 2px solid #2a2340; cursor: pointer; }
  .btn { background: #2a2340; color: #ffd9c0; border: 3px solid #5a4a7a; font-family: inherit; cursor: pointer; }
  .btn:hover { background: #3a3057; }
</style>

<script>
(function () {
  'use strict';
  var MONTHS = ['Ocak','\u015eubat','Mart','Nisan','May\u0131s','Haziran','Temmuz','A\u011fustos','Eyl\u00fcl','Ekim','Kas\u0131m','Aral\u0131k'];
  var NAMES = ['Birtanem', 'Biricik'];
  var ENC_FILE = 'chat.enc';
  var ITER = 250000;

  var STOPS = [
    {h:0,    top:'#0a0e28', mid:'#141138', bot:'#231a44', star:1,    amb:'rgba(20,18,58,0.42)', lamp:1,    e:-0.22, sun:'#cfd8ff', lit:'#3a3050'},
    {h:4.5,  top:'#241f4e', mid:'#3d2c58', bot:'#6d4664', star:0.55, amb:'rgba(52,36,78,0.34)', lamp:0.9,  e:-0.04, sun:'#ff9a6b', lit:'#4a3a58'},
    {h:7,    top:'#7ba4d6', mid:'#c9a6c0', bot:'#ffc79a', star:0,    amb:'rgba(255,198,158,0.18)', lamp:0.18, e:0.26, sun:'#ffd28a', lit:'#5a4a60'},
    {h:12,   top:'#5aa4e8', mid:'#8fc8f2', bot:'#cfe9f8', star:0,    amb:'rgba(255,252,238,0.10)', lamp:0,   e:1,    sun:'#fff6cf', lit:'#6a6070'},
    {h:17,   top:'#7098d0', mid:'#c3b6c6', bot:'#ffd9a0', star:0,    amb:'rgba(255,190,132,0.20)', lamp:0.12, e:0.42, sun:'#ffc36b', lit:'#5f4c58'},
    {h:19.5, top:'#54417f', mid:'#a05a76', bot:'#ff8a5c', star:0.16, amb:'rgba(255,128,88,0.28)', lamp:0.55, e:0.05, sun:'#ff6b4a', lit:'#54405c'},
    {h:21.5, top:'#211a48', mid:'#3a2551', bot:'#5f3a63', star:0.65, amb:'rgba(44,32,72,0.36)', lamp:0.96, e:-0.16, sun:'#8a6bff', lit:'#3f3352'},
    {h:24,   top:'#0a0e28', mid:'#141138', bot:'#231a44', star:1,    amb:'rgba(20,18,58,0.42)', lamp:1,    e:-0.22, sun:'#cfd8ff', lit:'#3a3050'}
  ];
  function hx(c) { return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
  function mixHex(a,b,t) { var A=hx(a),B=hx(b); function p(n){ return Math.round(A[n]+(B[n]-A[n])*t).toString(16).padStart(2,'0'); } return '#'+p(0)+p(1)+p(2); }
  function rp(s) { return s.slice(s.indexOf('(')+1, s.lastIndexOf(')')).split(',').map(Number); }
  function mixRgba(a,b,t) { var A=rp(a),B=rp(b); function v(n){ return n<3 ? Math.round(A[n]+(B[n]-A[n])*t) : +(A[n]+(B[n]-A[n])*t).toFixed(3); } return 'rgba('+v(0)+','+v(1)+','+v(2)+','+v(3)+')'; }
  function palette(hour) {
    var i = 0;
    while (i < STOPS.length - 2 && hour >= STOPS[i+1].h) i++;
    var a = STOPS[i], b = STOPS[i+1];
    var t = Math.max(0, Math.min(1, (hour - a.h) / (b.h - a.h)));
    var s = t*t*(3-2*t);
    return { top:mixHex(a.top,b.top,s), mid:mixHex(a.mid,b.mid,s), bot:mixHex(a.bot,b.bot,s),
      star:a.star+(b.star-a.star)*s, amb:mixRgba(a.amb,b.amb,s), lamp:a.lamp+(b.lamp-a.lamp)*s,
      e:a.e+(b.e-a.e)*s, sun:mixHex(a.sun,b.sun,s), lit:mixHex(a.lit,b.lit,s) };
  }

  var $ = function (id) { return document.getElementById(id); };
  var refs = {};
  function collect() {
    ['sky','sun','moon','ph1','ph1g','ph2','ph2g','dateLabel','clockLabel','clockDot','counter','thread','tl','tr','play','seek','speedLabel'].forEach(function (k) { refs[k] = $(k); });
    refs.stars = [].slice.call(document.querySelectorAll('.stars'));
    refs.day = [].slice.call(document.querySelectorAll('.day'));
    refs.wlit = [].slice.call(document.querySelectorAll('.wlit'));
    refs.wsky = [].slice.call(document.querySelectorAll('.wsky'));
    refs.lamp = [].slice.call(document.querySelectorAll('.lamp'));
    refs.scr  = [].slice.call(document.querySelectorAll('.scr'));
    refs.amb  = [].slice.call(document.querySelectorAll('.amb'));
  }

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    $('fit').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  function b64ToBytes(b64) {
    var bin = atob(b64.replace(/\s+/g, ''));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decrypt(bytes, password) {
    var magic = String.fromCharCode.apply(null, bytes.slice(0, 8));
    if (magic !== 'Salted__') throw new Error('Dosya bi\u00e7imi tan\u0131nmad\u0131 (openssl -salt bekleniyor).');
    var salt = bytes.slice(8, 16), ct = bytes.slice(16);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base, 384);
    var kv = new Uint8Array(bits);
    var key = await crypto.subtle.importKey('raw', kv.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: kv.slice(32, 48) }, key, ct);
    return new TextDecoder('utf-8').decode(pt);
  }

  var HEAD_SLASH = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4}),? (\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|am|pm)? - ([\s\S]*)$/;
  var HEAD_DOT = /^(\d{1,2})[.\-](\d{1,2})[.\-](\d{2}|\d{4}),? (\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|am|pm)? - ([\s\S]*)$/;
  var SKIPPED = 0;

  function yr(v) { var n = +v; return n < 100 ? 2000 + n : n; }

  function parseChat(text) {
    var lines = text.split(/\r?\n/), msgs = [];
    SKIPPED = 0;
    for (var k = 0; k < lines.length; k++) {
      var ln = lines[k], dotFmt = false, m = ln.match(HEAD_SLASH);
      if (!m) { m = ln.match(HEAD_DOT); dotFmt = !!m; }
      if (m) {
        var h = +m[4];
        if (m[6]) { var P = m[6].toUpperCase() === 'PM'; if (h === 12) h = P ? 12 : 0; else if (P) h += 12; }
        // slash = month-first (WhatsApp US); dot/dash = day-first (EU)
        var mo = dotFmt ? +m[2] : +m[1], da = dotFmt ? +m[1] : +m[2];
        if (mo > 12 && da <= 12) { var sw = mo; mo = da; da = sw; }
        var rest = m[7], c = rest.indexOf(': ');
        if (!(c > 0 && c < 40)) { SKIPPED++; continue; }
        msgs.push({ t: Date.UTC(yr(m[3]), mo - 1, da, h, +m[5]), s: rest.slice(0, c) === NAMES[0] ? 0 : 1, x: rest.slice(c + 2) });
      } else if (msgs.length && ln.trim()) {
        msgs[msgs.length - 1].x += '\n' + ln;
      } else if (ln.trim()) {
        SKIPPED++;
      }
    }
    msgs.sort(function (a, b) { return a.t - b.t; });
    return msgs;
  }

  var M = [], base = 0, N = 0, RANGE = '';
  var st = { i: 0, playing: true, mins: 0, typing: -1, speed: 1 }, p = 0, last = 0, lastMin = -1, lastI = -1;
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  function two(n) { return String(n).padStart(2, '0'); }

  var KEEP = 5;
  var shown = -1;

  function bubbleNode(m, animate) {
    var her = m.s === 0, d = new Date(m.t);
    var w = document.createElement('div');
    w.style.cssText = 'display:flex;flex:0 0 auto;flex-direction:column;max-width:90%;align-self:' + (her ? 'flex-start' : 'flex-end') +
      ';align-items:' + (her ? 'flex-start' : 'flex-end') + ';transition:opacity 320ms linear';
    if (animate) w.style.animation = 'rise 380ms ease-out';
    w.innerHTML =
      '<div style="padding:8px 12px;background:' + (her ? '#f6e3ef' : '#dceaf8') + ';color:' + (her ? '#3a2030' : '#1d2b3a') +
      ';border:3px solid ' + (her ? '#b06a90' : '#5a80ae') + ';box-shadow:5px 5px 0 rgba(0,0,0,0.45);font-size:22px;line-height:1.25;text-wrap:pretty;white-space:pre-wrap">' + esc(m.x) + '</div>' +
      '<div style="margin-top:2px;font-size:15px;color:' + (her ? '#ffd9ec' : '#cfe6ff') + ';text-shadow:2px 2px 0 rgba(0,0,0,0.6)">' +
      NAMES[m.s] + ' \u00b7 ' + two(d.getUTCHours()) + ':' + two(d.getUTCMinutes()) + '</div>';
    return w;
  }

  var OPS = [1, 0.78, 0.58, 0.4, 0.26, 0.18, 0.12, 0.08];
  function fade() {
    var c = refs.thread.children, n = c.length;
    for (var i = 0; i < n; i++) c[i].style.opacity = String(OPS[n - 1 - i] || 0.08);
  }

  function rebuild() {
    var from = Math.max(0, st.i - KEEP + 1);
    refs.thread.innerHTML = '';
    for (var k = from; k <= st.i; k++) refs.thread.appendChild(bubbleNode(M[k], false));
    shown = st.i;
    fade();
  }

  function appendLatest() {
    if (shown === st.i) return;
    if (shown !== st.i - 1) { rebuild(); return; }
    refs.thread.appendChild(bubbleNode(M[st.i], true));
    while (refs.thread.children.length > KEEP) refs.thread.removeChild(refs.thread.firstChild);
    shown = st.i;
    fade();
  }

  function paintScene() {
    var now = new Date(base + st.mins * 60000);
    var hour = now.getUTCHours() + now.getUTCMinutes() / 60;
    var P = palette(hour);
    var dayFrac = Math.max(0, Math.min(1, (hour - 5.5) / 13.5));
    var nightFrac = Math.max(0, Math.min(1, (((hour - 18.5) + 24) % 24) / 11.5));
    var el = Math.max(-0.25, P.e);
    refs.sky.style.background = 'linear-gradient(180deg,' + P.top + ' 0%,' + P.mid + ' 58%,' + P.bot + ' 100%)';
    var so = P.star.toFixed(3);
    refs.stars.forEach(function (e) { e.style.opacity = so; });
    var dy = Math.max(0.12, Math.min(1, 0.25 + P.e)).toFixed(3);
    refs.day.forEach(function (e) { e.style.opacity = dy; });
    refs.sun.style.background = P.sun;
    refs.sun.style.opacity = Math.max(0, Math.min(1, P.e * 6)).toFixed(3);
    refs.sun.style.transform = 'translate(' + Math.round(14 + dayFrac * 292) + 'px,' + Math.round(20 - Math.max(0, el) * 15) + 'px)';
    refs.sun.style.boxShadow = '0 0 8px 4px rgba(255,210,140,' + (Math.max(0, Math.min(1, P.e * 2)) * 0.5).toFixed(3) + ')';
    refs.moon.style.opacity = Math.max(0, Math.min(1, -P.e * 4.5)).toFixed(3);
    refs.moon.style.transform = 'translate(' + Math.round(292 - nightFrac * 288) + 'px,' + Math.round(19 - Math.sin(nightFrac * Math.PI) * 14) + 'px)';
    var wskyBg = 'linear-gradient(180deg,' + P.top + ' 0%,' + P.bot + ' 100%)';
    refs.wsky.forEach(function (e) { e.style.background = wskyBg; });
    refs.wlit.forEach(function (e) { e.style.background = P.lit; });
    var la = P.lamp.toFixed(3);
    refs.lamp.forEach(function (e) { e.style.opacity = la; });
    var sa = Math.max(0.35, P.lamp).toFixed(3);
    refs.scr.forEach(function (e) { e.style.opacity = sa; });
    refs.amb.forEach(function (e) { e.style.background = P.amb; });
    refs.ph1.style.background = st.typing === 0 ? '#fff4d8' : '#bfe6ff';
    refs.ph1g.style.background = 'radial-gradient(circle at 50% 50%,' + (st.typing === 0 ? 'rgba(255,240,200,0.6)' : 'rgba(150,220,255,0.42)') + ',rgba(0,0,0,0) 70%)';
    refs.ph2.style.background = st.typing === 1 ? '#fff4d8' : '#bfe6ff';
    refs.ph2g.style.background = 'radial-gradient(circle at 50% 50%,' + (st.typing === 1 ? 'rgba(255,240,200,0.6)' : 'rgba(150,220,255,0.42)') + ',rgba(0,0,0,0) 70%)';
    refs.dateLabel.textContent = now.getUTCDate() + ' ' + MONTHS[now.getUTCMonth()] + ' ' + now.getUTCFullYear();
    refs.clockLabel.textContent = two(now.getUTCHours()) + ':' + two(now.getUTCMinutes());
    refs.clockDot.style.background = P.lamp > 0.5 ? '#8a6bff' : '#ffc36b';
    refs.tl.style.display = st.typing === 0 ? 'flex' : 'none';
    refs.tr.style.display = st.typing === 1 ? 'flex' : 'none';
  }

  function paintMsg(jumped) {
    if (jumped) { rebuild(); } else { appendLatest(); }
    refs.counter.textContent = (st.i + 1).toLocaleString('tr-TR') + ' / ' + N.toLocaleString('tr-TR') + ' mesaj' + RANGE;
    refs.seek.value = String(st.i);
    try { localStorage.setItem('sb-chat-idx', String(st.i)); } catch (e) {}
  }

  function loop(ts) {
    requestAnimationFrame(loop);
    if (!last) last = ts;
    var dt = Math.min(120, ts - last);
    last = ts;
    if (!st.playing || !N) return;
    var cur = M[st.i];
    var dwell = Math.min(4200, 780 + 26 * cur.x.length) / st.speed;
    p += dt / dwell;
    if (p >= 1) {
      p = 0;
      st.i = st.i + 1 >= N ? 0 : st.i + 1;
      st.mins = (M[st.i].t - base) / 60000;
      st.typing = -1;
      paintMsg();
      paintScene();
      lastMin = Math.round(st.mins);
      return;
    }
    var nx = M[st.i + 1] || M[0];
    var cd = (cur.t - base) / 60000, nd = (nx.t - base) / 60000;
    st.mins = cd + (nd > cd ? (nd - cd) * p : 0);
    var typing = p > 0.55 && nx !== cur ? nx.s : -1;
    if (Math.round(st.mins) !== lastMin || typing !== st.typing) {
      lastMin = Math.round(st.mins);
      st.typing = typing;
      paintScene();
    }
  }

  function start(text) {
    M = parseChat(text);
    if (!M.length) throw new Error('Sohbet okunamad\u0131.');
    N = M.length;
    base = M[0].t;
    var d0 = new Date(M[0].t), d1 = new Date(M[N - 1].t);
    RANGE = '\n' + d0.getUTCDate() + ' ' + MONTHS[d0.getUTCMonth()] + ' ' + d0.getUTCFullYear() +
      ' \u2192 ' + d1.getUTCDate() + ' ' + MONTHS[d1.getUTCMonth()] + ' ' + d1.getUTCFullYear();
    if (window.console) console.log('[chat] ' + N + ' messages, ' + SKIPPED + ' lines skipped, ' + d0.toISOString() + ' -> ' + d1.toISOString());
    $('gate').style.display = 'none';
    $('fit').style.display = 'block';
    collect();
    fit();
    var saved = 0;
    try {
      var v = +localStorage.getItem('sb-chat-idx');
      var sig = localStorage.getItem('sb-chat-sig');
      if (sig === String(N) && v > 0 && v < N) saved = v;   // new/changed archive -> start at the beginning
      localStorage.setItem('sb-chat-sig', String(N));
    } catch (e) {}
    st.i = saved;
    st.mins = (M[st.i].t - base) / 60000;
    refs.seek.max = String(N - 1);
    refs.play.onclick = function () { st.playing = !st.playing; refs.play.innerHTML = st.playing ? '&#10074;&#10074;' : '&#9654;'; };
    refs.seek.oninput = function () {
      st.i = Math.max(0, Math.min(N - 1, +refs.seek.value));
      p = 0; st.typing = -1; st.mins = (M[st.i].t - base) / 60000; st.playing = true;
      refs.play.innerHTML = '&#10074;&#10074;';
      paintMsg(true); paintScene();
    };
    var bgm = $('bgm'), sndBtn = $('sound'), sndOn = true;
    try { sndOn = localStorage.getItem('sb-chat-muted') !== '1'; } catch (e) {}
    bgm.volume = 0.32;
    function paintSound() {
      sndBtn.style.opacity = sndOn ? '1' : '0.38';
      sndBtn.title = sndOn ? 'M\u00fczi\u011fi kapat' : 'M\u00fczi\u011fi a\u00e7';
    }
    function playBgm() {
      var pr = bgm.play();
      if (pr && pr.catch) pr.catch(function () {
        var h = function () {
          document.removeEventListener('pointerdown', h);
          document.removeEventListener('keydown', h);
          if (sndOn) bgm.play().catch(function () {});
        };
        document.addEventListener('pointerdown', h);
        document.addEventListener('keydown', h);
      });
    }
    sndBtn.onclick = function () {
      sndOn = !sndOn;
      try { localStorage.setItem('sb-chat-muted', sndOn ? '0' : '1'); } catch (e) {}
      paintSound();
      if (sndOn) playBgm(); else bgm.pause();
    };
    paintSound();
    if (sndOn) playBgm();
    $('rew').onclick = function () {
      st.i = 0; p = 0; st.typing = -1; st.mins = 0; st.playing = true;
      refs.play.innerHTML = '&#10074;&#10074;';
      paintMsg(true); paintScene();
    };
    $('slower').onclick = function () { st.speed = Math.max(0.25, +(st.speed / 1.5).toFixed(3)); refs.speedLabel.textContent = st.speed + '\u00d7'; };
    $('faster').onclick = function () { st.speed = Math.min(64, +(st.speed * 1.5).toFixed(3)); refs.speedLabel.textContent = st.speed + '\u00d7'; };
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space') { e.preventDefault(); refs.play.click(); }
    });
    paintMsg(true);
    paintScene();
    requestAnimationFrame(loop);
  }

  $('gateForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var err = $('err'), pw = $('pw').value;
    if (!pw) { err.textContent = '\u015eifre gerekli.'; return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = 'Bu taray\u0131c\u0131da \u015fifre \u00e7\u00f6z\u00fclemiyor \u2014 sayfay\u0131 https:// veya localhost \u00fczerinden a\u00e7.'; return; }
    err.style.color = '#9c8cbe';
    err.textContent = '\u00e7\u00f6z\u00fcl\u00fcyor\u2026';
    $('go').disabled = true;
    try {
      var res = await fetch(ENC_FILE + '?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(ENC_FILE + ' bulunamad\u0131 (' + res.status + ').');
      var text = await decrypt(b64ToBytes(await res.text()), pw);
      start(text);
    } catch (ex) {
      err.style.color = '#ff8a8a';
      err.textContent = /operation|decrypt/i.test(String(ex && ex.message)) || !ex.message ? '\u015eifre yanl\u0131\u015f.' : ex.message;
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
